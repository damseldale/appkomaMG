apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-users
  namespace: animaker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-users
  template:
    metadata:
      labels:
        app: service-users
    spec:
      containers:
      - name: service-users
        image: animaker/service-users:latest
        ports:
        - containerPort: 4001
        env:
        - name: PORT
          value: "4001"
        resources:
          limits:
            cpu: "500m"
            memory: 512Mi
          requests:
            cpu: "200m"
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: service-users
  namespace: animaker
spec:
  selector:
    app: service-users
  ports:
  - port: 4001
    targetPort: 4001
  type: ClusterIP
